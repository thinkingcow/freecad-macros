<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spur Gear Dimension Calculator</title>
<style>
:root {
  --bg-primary: #0f172a;
  --bg-card: #1e293b;
  --bg-input: #334155;
  --bg-input-hover: #475569;
  --accent-primary: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.2);
  --accent-warning: #fbbf24;
  --accent-warning-bg: rgba(251, 191, 36, 0.12);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --border-color: #334155;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg-primary: #f1f5f9;
    --bg-card: #ffffff;
    --bg-input: #e2e8f0;
    --bg-input-hover: #cbd5e1;
    --accent-primary: #0284c7;
    --accent-glow: rgba(2, 132, 199, 0.15);
    --accent-warning: #d97706;
    --accent-warning-bg: rgba(217, 119, 6, 0.1);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
  overflow-x: hidden;
}

.calculator-card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  width: 100%;
  max-width: 820px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 10px;
}

.header-title {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-title::before {
  content: "";
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: var(--accent-primary);
  box-shadow: 0 0 8px var(--accent-primary);
}

.undercut-badge {
  font-size: 0.75rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  background-color: var(--accent-warning-bg);
  color: var(--accent-warning);
  border: 1px solid rgba(251, 191, 36, 0.3);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.undercut-badge.hidden {
  opacity: 0;
  visibility: hidden;
  transform: scale(0.95);
  pointer-events: none;
}

.main-grid {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 18px;
}

@media (max-width: 680px) {
  .main-grid {
    grid-template-columns: 1fr;
  }
}

.inputs-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.control-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-muted);
}

.control-value {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--accent-primary);
  font-variant-numeric: tabular-nums;
  background: var(--bg-input);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
}

.slider-container {
  display: flex;
  align-items: center;
  gap: 8px;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: var(--bg-input);
  outline: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent-primary);
  cursor: pointer;
  box-shadow: 0 0 6px var(--accent-glow);
  transition: transform 0.1s ease;
}

input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.15);
}

input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent-primary);
  cursor: pointer;
  border: none;
  box-shadow: 0 0 6px var(--accent-glow);
}

.btn-group {
  display: flex;
  gap: 6px;
  background: var(--bg-input);
  padding: 3px;
  border-radius: var(--radius-sm);
}

.btn-option {
  flex: 1;
  padding: 6px 0;
  font-size: 0.8rem;
  font-weight: 600;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: calc(var(--radius-sm) - 2px);
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-option.active {
  background: var(--accent-primary);
  color: #ffffff;
  box-shadow: 0 2px 6px var(--accent-glow);
}

.btn-option:hover:not(.active) {
  color: var(--text-main);
  background: var(--bg-input-hover);
}

.outputs-section {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.metric-card {
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: border-color 0.2s ease, transform 0.15s ease;
}

.metric-card:hover {
  border-color: var(--accent-primary);
  transform: translateY(-1px);
}

.metric-label-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.metric-symbol {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--accent-primary);
  font-family: monospace;
}

.metric-title {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.metric-value-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-top: 6px;
}

.metric-value {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text-main);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.metric-unit {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-muted);
}

.footer-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--border-color);
  padding-top: 10px;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.preset-btns {
  display: flex;
  gap: 6px;
}

.preset-btn {
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  font-size: 0.72rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s ease;
}

.preset-btn:hover {
  background: var(--bg-input-hover);
  border-color: var(--accent-primary);
}
</style>
</head>
<body>

<div class="calculator-card">
  <div class="header">
    <div class="header-title">Spur Gear Dimensions</div>
    <div id="undercutBadge" class="undercut-badge hidden" title="Gears with z < 17 and x = 0 exhibit profile undercutting">
      ⚠️ Undercutting Warning (z &lt; 17)
    </div>
  </div>

  <div class="main-grid">
    <!-- Input Sliders Section -->
    <div class="inputs-section">
      <!-- Modulus Input -->
      <div class="control-group">
        <div class="control-header">
          <label for="modulusInput">Modulus (m)</label>
          <span class="control-value" id="modulusVal">1.0 mm</span>
        </div>
        <div class="slider-container">
          <input type="range" id="modulusInput" min="0.1" max="5.0" step="0.1" value="1.0">
        </div>
      </div>

      <!-- Tooth Count Input -->
      <div class="control-group">
        <div class="control-header">
          <label for="teethInput">Teeth Count (z)</label>
          <span class="control-value" id="teethVal">20</span>
        </div>
        <div class="slider-container">
          <input type="range" id="teethInput" min="8" max="120" step="1" value="20">
        </div>
      </div>

      <!-- Pressure Angle Toggle -->
      <div class="control-group">
        <div class="control-header">
          <span>Pressure Angle (α)</span>
          <span class="control-value" id="alphaVal">20.0°</span>
        </div>
        <div class="btn-group" id="alphaBtnGroup">
          <button class="btn-option" data-angle="14.5">14.5°</button>
          <button class="btn-option active" data-angle="20">20.0°</button>
          <button class="btn-option" data-angle="25">25.0°</button>
        </div>
      </div>

      <!-- Profile Shift Input -->
      <div class="control-group">
        <div class="control-header">
          <label for="shiftInput">Profile Shift (x)</label>
          <span class="control-value" id="shiftVal">0.00</span>
        </div>
        <div class="slider-container">
          <input type="range" id="shiftInput" min="-0.50" max="0.50" step="0.05" value="0.00">
        </div>
      </div>
    </div>

    <!-- Calculated Outputs Grid -->
    <div class="outputs-section">
      <!-- Pitch Diameter -->
      <div class="metric-card">
        <div class="metric-label-row">
          <span class="metric-title">Pitch Diameter</span>
          <span class="metric-symbol">d</span>
        </div>
        <div class="metric-value-row">
          <span class="metric-value" id="pitchDia">20.000</span>
          <span class="metric-unit">mm</span>
        </div>
      </div>

      <!-- Outside Diameter -->
      <div class="metric-card">
        <div class="metric-label-row">
          <span class="metric-title">Outside Dia.</span>
          <span class="metric-symbol">d<sub>a</sub></span>
        </div>
        <div class="metric-value-row">
          <span class="metric-value" id="outsideDia">22.000</span>
          <span class="metric-unit">mm</span>
        </div>
      </div>

      <!-- Root Diameter -->
      <div class="metric-card">
        <div class="metric-label-row">
          <span class="metric-title">Root Dia.</span>
          <span class="metric-symbol">d<sub>f</sub></span>
        </div>
        <div class="metric-value-row">
          <span class="metric-value" id="rootDia">17.500</span>
          <span class="metric-unit">mm</span>
        </div>
      </div>

      <!-- Base Diameter -->
      <div class="metric-card">
        <div class="metric-label-row">
          <span class="metric-title">Base Dia.</span>
          <span class="metric-symbol">d<sub>b</sub></span>
        </div>
        <div class="metric-value-row">
          <span class="metric-value" id="baseDia">18.794</span>
          <span class="metric-unit">mm</span>
        </div>
      </div>

      <!-- Circular Pitch -->
      <div class="metric-card">
        <div class="metric-label-row">
          <span class="metric-title">Circular Pitch</span>
          <span class="metric-symbol">p</span>
        </div>
        <div class="metric-value-row">
          <span class="metric-value" id="circularPitch">3.142</span>
          <span class="metric-unit">mm</span>
        </div>
      </div>

      <!-- Whole Depth -->
      <div class="metric-card">
        <div class="metric-label-row">
          <span class="metric-title">Whole Depth</span>
          <span class="metric-symbol">h</span>
        </div>
        <div class="metric-value-row">
          <span class="metric-value" id="wholeDepth">2.250</span>
          <span class="metric-unit">mm</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Quick Presets -->
  <div class="footer-bar">
    <span>Quick Presets:</span>
    <div class="preset-btns">
      <button class="preset-btn" onclick="applyPreset(0.8, 20, 20, 0)">m=0.8, z=20</button>
      <button class="preset-btn" onclick="applyPreset(1.0, 12, 20, 0)">m=1.0, z=12</button>
      <button class="preset-btn" onclick="applyPreset(1.0, 40, 20, 0)">m=1.0, z=40</button>
    </div>
  </div>
</div>

<script>
// App State
let state = {
  m: 1.0,
  z: 20,
  alpha: 20.0,
  x: 0.00
};

// DOM References
const modulusInput = document.getElementById('modulusInput');
const teethInput = document.getElementById('teethInput');
const shiftInput = document.getElementById('shiftInput');
const alphaBtnGroup = document.getElementById('alphaBtnGroup');

const modulusVal = document.getElementById('modulusVal');
const teethVal = document.getElementById('teethVal');
const alphaVal = document.getElementById('alphaVal');
const shiftVal = document.getElementById('shiftVal');

const pitchDiaEl = document.getElementById('pitchDia');
const outsideDiaEl = document.getElementById('outsideDia');
const rootDiaEl = document.getElementById('rootDia');
const baseDiaEl = document.getElementById('baseDia');
const circularPitchEl = document.getElementById('circularPitch');
const wholeDepthEl = document.getElementById('wholeDepth');
const undercutBadge = document.getElementById('undercutBadge');

function calculateDimensions() {
  const { m, z, alpha, x } = state;

  // Formulas for standard involute spur gears
  const alphaRad = (alpha * Math.PI) / 180;
  
  const d = m * z;                           // Pitch diameter
  const d_a = m * (z + 2 + 2 * x);           // Outside diameter
  const d_f = m * (z - 2.5 + 2 * x);         // Root diameter
  const d_b = d * Math.cos(alphaRad);        // Base diameter
  const p = Math.PI * m;                     // Circular pitch
  const h = 2.25 * m;                        // Whole depth

  // Update Output Display
  pitchDiaEl.textContent = d.toFixed(3);
  outsideDiaEl.textContent = d_a.toFixed(3);
  rootDiaEl.textContent = d_f.toFixed(3);
  baseDiaEl.textContent = d_b.toFixed(3);
  circularPitchEl.textContent = p.toFixed(3);
  wholeDepthEl.textContent = h.toFixed(3);

  // Undercutting Warning Detection (Standard z_min = 2 / sin^2(alpha) * (1 - x))
  const minTeethWithoutUndercut = (2 / Math.pow(Math.sin(alphaRad), 2)) * (1 - x);
  if (z < minTeethWithoutUndercut && x <= 0) {
    undercutBadge.classList.remove('hidden');
  } else {
    undercutBadge.classList.add('hidden');
  }
}

function updateUI() {
  modulusVal.textContent = `${state.m.toFixed(1)} mm`;
  teethVal.textContent = state.z;
  alphaVal.textContent = `${state.alpha.toFixed(1)}°`;
  shiftVal.textContent = (state.x >= 0 ? '+' : '') + state.x.toFixed(2);

  modulusInput.value = state.m;
  teethInput.value = state.z;
  shiftInput.value = state.x;

  Array.from(alphaBtnGroup.children).forEach(btn => {
    const angle = parseFloat(btn.dataset.angle);
    if (angle === state.alpha) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  calculateDimensions();
}

// Input Handlers
modulusInput.addEventListener('input', (e) => {
  state.m = parseFloat(e.target.value);
  updateUI();
});

teethInput.addEventListener('input', (e) => {
  state.z = parseInt(e.target.value, 10);
  updateUI();
});

shiftInput.addEventListener('input', (e) => {
  state.x = parseFloat(e.target.value);
  updateUI();
});

alphaBtnGroup.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-option');
  if (!btn) return;
  state.alpha = parseFloat(btn.dataset.angle);
  updateUI();
});

function applyPreset(m, z, alpha, x) {
  state.m = m;
  state.z = z;
  state.alpha = alpha;
  state.x = x;
  updateUI();
}

// Initial calculation
updateUI();
</script>
</body>
</html>
